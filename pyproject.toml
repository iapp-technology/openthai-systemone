[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openthai-systemone"
version = "0.1.0"
description = "OpenThai-SystemOne: an open Thai/English System-One decision model (256-way slot softmax on Qwen3.5-0.8B)"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [{name = "iApp Technology / OpenThai"}]
dependencies = [
  "torch>=2.4",
  "transformers>=5.0",
  "numpy",
  "pydantic>=2",
]

[project.urls]
Homepage = "https://iapp.co.th/docs/llm/openthai-systemone"
Repository = "https://github.com/iapp-technology/openthai-systemone"
Model = "https://huggingface.co/iapp/OpenThai-SystemOne"

[project.optional-dependencies]
server = ["fastapi", "uvicorn"]
train = ["datasets", "accelerate", "pyyaml", "tqdm", "openai"]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["openthai_systemone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
